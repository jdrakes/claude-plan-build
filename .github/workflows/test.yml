name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The leak scan lists candidates with `git ls-files --cached
          # --others --exclude-standard`, which needs a real checkout rather
          # than a shallow export.
          fetch-depth: 1

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install typst 0.15.1
        run: |
          curl --fail -sL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo install -m 755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install Python dependencies
        run: pip install pyyaml

      # A skipped fidelity check on a runner that installs its own typst means
      # the workflow is broken, not that the host is unusual. Without this the
      # suite would pass with the renderer unchecked.
      - run: bash scripts/test.sh
        env:
          RESUME_KIT_REQUIRE_FIDELITY: "1"
