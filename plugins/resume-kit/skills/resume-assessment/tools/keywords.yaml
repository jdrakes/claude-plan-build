# Technology/skill keywords the gap-check watches for in job-posting text.
# Maintain this over time — add a term the first time a posting uses it and
# the resume doesn't cover it, so the next assessment catches it too.
#
# Matching is case-insensitive, word-boundary. Multi-word terms (e.g.
# "Node.js") match as a phrase.

